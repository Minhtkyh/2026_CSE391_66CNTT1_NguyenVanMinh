<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bảng Điểm Sinh Viên</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Quản lý điểm sinh viên</h2>

<div class="controls">
<input type="text" id="name" placeholder="Họ tên">
<input type="number" id="score" placeholder="Điểm (0-10)" step="0.1">
<button id="addBtn">Thêm</button>
</div>

<div class="controls">
<input type="text" id="search" placeholder="Tìm kiếm tên sinh viên...">

<select id="filterRank">
<option value="all">Tất cả</option>
<option value="Giỏi">Giỏi</option>
<option value="Khá">Khá</option>
<option value="Trung bình">Trung bình</option>
<option value="Yếu">Yếu</option>
</select>
</div>

<table>
<thead>
<tr>
<th>STT</th>
<th>Họ tên</th>
<th id="scoreHeader">Điểm</th>
<th>Xếp loại</th>
<th>Thao tác</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

<div id="noResult"></div>

<div id="stats">
Tổng SV: 0 | Điểm TB: 0
</div>

<script src="script.js"></script>

</body>
</html>
